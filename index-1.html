<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShebaFinder Bangladesh | বাংলাদেশের সকল সেবা এক জায়গায়</title>
<meta name="description" content="Find emergency numbers and official service links in Bangladesh. বাংলাদেশের জরুরি নম্বর ও সরকারি সেবার লিংক।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#006a4e;--green-d:#004d38;--green-l:#e6f4ef;--red:#f42a41;--red-l:#fdecee;--bg:#f6f8f7;--card:#fff;--text:#14211c;--muted:#5b6b64;--line:#e0e8e4;--r:18px;--shadow:0 4px 16px rgba(0,60,40,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Bengali','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:var(--green)}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--green);display:grid;place-items:center;font-style:normal;font-size:1rem}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--muted);white-space:nowrap}
nav a:hover{background:var(--green-l);color:var(--green)}
.lang{display:flex;background:var(--green-l);border-radius:999px;padding:3px;flex-shrink:0}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font:600 .85rem inherit;font-family:inherit;color:var(--green);cursor:pointer}
.lang button.on{background:var(--green);color:#fff}
@media(max-width:760px){.bar{flex-wrap:wrap;height:auto;padding:8px 0}nav{order:3;width:100%}}
.hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:44px 0 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:var(--red);opacity:.9}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(1.7rem,6vw,2.8rem);line-height:1.3;margin-bottom:10px}
.hero p{max-width:560px;opacity:.92;margin-bottom:24px}
.search{display:flex;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:640px;align-items:center;gap:8px}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:1rem;color:var(--text);background:none;padding:8px 0}
.search button{border:0;background:var(--green);color:#fff;border-radius:999px;padding:10px 20px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
section{padding:36px 0}
h2{font-size:1.4rem;color:var(--green-d);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:20px;font-size:.95rem}
.sos{background:var(--red-l);border-top:4px solid var(--red)}
.sos h2{color:#b3101f}
.grid{display:grid;gap:14px}
.nums{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.num{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:1px solid #f6c9ce}
.num:hover{transform:translateY(-2px)}
.num b{font-size:1.5rem;color:var(--red);min-width:64px;font-variant-numeric:tabular-nums}
.num span{font-size:.9rem;line-height:1.35}
.num.main{background:var(--red);border-color:var(--red);color:#fff}
.num.main b{color:#fff}
.cats{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cat{background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:18px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;font:inherit;font-family:inherit;color:inherit;transition:.2s}
.cat:hover{transform:translateY(-3px);border-color:var(--green)}
.cat.on{border-color:var(--green);background:var(--green-l)}
.cat .ic{font-size:2rem;display:block;margin-bottom:6px}
.cat strong{display:block;font-size:.95rem;line-height:1.4}
.cat small{color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:500 .88rem inherit;font-family:inherit;white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.list{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.svc{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tag{align-self:flex-start;background:var(--green-l);color:var(--green);font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px}
.svc h3{font-size:1.02rem;line-height:1.4}
.svc p{font-size:.88rem;color:var(--muted);flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-block;padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600}
.btn.web{background:var(--green);color:#fff}
.btn.tel{background:var(--red);color:#fff}
.empty{text-align:center;padding:36px 12px;color:var(--muted);background:#fff;border-radius:var(--r)}
.count{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.links{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.links a{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:block;box-shadow:var(--shadow)}
.links a:hover{border-color:var(--green)}
.links b{display:block;color:var(--green);font-size:.95rem}
.links span{font-size:.8rem;color:var(--muted);word-break:break-all}
footer{background:#10201a;color:#cfe0d8;padding:32px 0;margin-top:20px;font-size:.9rem}
footer strong{color:#fff}
footer .note{background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin:12px 0}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#top" class="logo"><i>🇧🇩</i><span>ShebaFinder BD</span></a>
    <nav>
      <a href="#emergency" data-t="nav_em"></a>
      <a href="#categories" data-t="nav_cat"></a>
      <a href="#services" data-t="nav_svc"></a>
      <a href="#links" data-t="nav_links"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button id="bnBtn" type="button">বাংলা</button>
      <button id="enBtn" type="button">EN</button>
    </div>
  </div>
</header>

<main id="top">
<div class="hero">
  <div class="wrap">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
    <form class="search" id="searchForm" role="search" onsubmit="return false">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" autocomplete="off" aria-label="Search">
      <button type="button" id="goBtn" data-t="search"></button>
    </form>
  </div>
</div>

<section class="sos" id="emergency">
  <div class="wrap">
    <h2 data-t="em_title"></h2>
    <p class="sub" data-t="em_sub"></p>
    <div class="grid nums" id="nums"></div>
  </div>
</section>

<section id="categories">
  <div class="wrap">
    <h2 data-t="cat_title"></h2>
    <p class="sub" data-t="cat_sub"></p>
    <div class="grid cats" id="cats"></div>
  </div>
</section>

<section id="services" style="padding-top:8px">
  <div class="wrap">
    <h2 data-t="svc_title"></h2>
    <div class="chips" id="chips"></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid list" id="list"></div>
  </div>
</section>

<section id="links" style="background:#fff">
  <div class="wrap">
    <h2 data-t="links_title"></h2>
    <p class="sub" data-t="links_sub"></p>
    <div class="grid links" id="linkGrid"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <strong>ShebaFinder Bangladesh</strong>
    <div class="note" data-t="disclaimer"></div>
    <div data-t="foot2"></div>
  </div>
</footer>
