<title>Bangladesh All-in-One Services | বাংলাদেশ অল-ইন-ওয়ান সার্ভিসেস</title>
<meta name="description" content="Unofficial directory of public service helplines and information for Bangladesh.">

<style>
/* ===== 1. THEME (edit colours here) ===== */
:root{--green:#006a4e;--green-d:#004d38;--red:#f42a41;--bg:#f6faf7;--card:#fff;--text:#14211b;--muted:#53625a;--line:#d9e5de;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--green-d)}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:28px 0}
h2{font-size:1.4rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-out{background:#fff;color:var(--green-d);border:2px solid var(--green)}
/* ===== 2. HEADER ===== */
header{background:var(--green);color:#fff;position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;max-width:1080px;margin:0 auto}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;font-size:1.05rem}
.dot{width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid #fff;flex:none}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;white-space:nowrap;font-size:.92rem}
nav a:hover{background:var(--green-d)}
#langBtn{background:#fff;color:var(--green-d);flex:none}
@media(max-width:700px){.bar{flex-wrap:wrap}nav{order:3;width:100%}}
/* ===== 3. HERO ===== */
.hero{background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:36px 0 44px}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 8px;line-height:1.3}
.hero p{margin:0 0 18px;max-width:600px;opacity:.95}
.search{display:flex;gap:8px;max-width:640px}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:0;font:inherit;min-height:48px}
.unofficial{margin-top:14px;font-size:.85rem;background:rgba(255,255,255,.14);display:inline-block;padding:6px 10px;border-radius:8px}
/* ===== 4. EMERGENCY ===== */
.emerg{background:#fff3f4;border-top:4px solid var(--red)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:0 0 10px;color:var(--muted);font-size:.93rem}
.num{font-size:1.8rem;font-weight:800;color:var(--red);line-height:1.1}
.card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row a.small{font-size:.88rem}
/* ===== 5. CATEGORIES ===== */
.cats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cat{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--text)}
.cat:hover,.cat.on{border-color:var(--green);background:#e8f5ee}
.cat .ic{font-size:1.9rem;display:block}
/* ===== 6. FILTERS ===== */
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
select{padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;min-height:44px;background:#fff;width:100%}
.note{background:#fff8e1;border-left:4px solid #ffb703;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.92rem}
.badge{display:inline-block;background:#ffe3e6;color:#a1001a;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.ok{background:#dff3e8;color:var(--green-d)}
/* ===== 7. TABS (agri / business) ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:9px 14px;border-radius:99px;border:2px solid var(--green);background:#fff;color:var(--green-d);font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--green);color:#fff}
.panel{display:none}.panel.on{display:block}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
th{background:#e8f5ee}
.scroll{overflow-x:auto}
/* ===== 8. CONTACT + FOOTER ===== */
textarea,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;margin-bottom:10px}
footer{background:#10231b;color:#cfe0d6;padding:24px 0;font-size:.9rem}
footer a{color:#fff}
.empty{text-align:center;color:var(--muted);padding:18px}
</style>
</head>

<section id="emergency" class="emerg"><div class="wrap">

<section><div class="wrap">

<section id="services"><div class="wrap">

<section id="safety"><div class="wrap">

<section id="contact"><div class="wrap">

</div></section>
</main>

{cat:"fire",tel:"102",url:"https://fireservice.gov.bd",bn:["ফায়ার সার্ভিস ১০২","অগ্নিকাণ্ড, উদ্ধার ও দুর্ঘটনায় ফায়ার সার্ভিস ও সিভিল ডিফেন্স হটলাইন।"],en:["Fire Service 102","Fire Service & Civil Defence hotline for fires, rescue and accidents."]},

{cat:"women",tel:"109",url:"https://dwa.gov.bd",bn:["নারী ও শিশু নির্যাতন প্রতিরোধ ১০৯","নারী ও শিশুর প্রতি সহিংসতায় সহায়তা হেল্পলাইন।"],en:["Violence against women & children 109","Helpline for violence against women and children."]},

/* ===== C. LOCATIONS (64 districts). Upazila lists are filled only where verified. ===== */
const DIV={
Dhaka:{bn:"ঢাকা",d:["Dhaka","Gazipur","Narayanganj","Narsingdi","Manikganj","Munshiganj","Tangail","Kishoreganj","Faridpur","Gopalganj","Madaripur","Rajbari","Shariatpur"]},
Chattogram:{bn:"চট্টগ্রাম",d:["Chattogram","Cox's Bazar","Cumilla","Feni","Brahmanbaria","Chandpur","Lakshmipur","Noakhali","Rangamati","Khagrachhari","Bandarban"]},
Rajshahi:{bn:"রাজশাহী",d:["Rajshahi","Bogura","Joypurhat","Naogaon","Natore","Chapainawabganj","Pabna","Sirajganj"]},
Khulna:{bn:"খুলনা",d:["Khulna","Bagerhat","Chuadanga","Jashore","Jhenaidah","Kushtia","Magura","Meherpur","Narail","Satkhira"]},
Barishal:{bn:"বরিশাল",d:["Barishal","Barguna","Bhola","Jhalokati","Patuakhali","Pirojpur"]},
Sylhet:{bn:"সিলেট",d:["Sylhet","Habiganj","Moulvibazar","Sunamganj"]},
Rangpur:{bn:"রংপুর",d:["Rangpur","Dinajpur","Gaibandha","Kurigram","Lalmonirhat","Nilphamari","Panchagarh","Thakurgaon"]},
Mymensingh:{bn:"ময়মনসিংহ",d:["Mymensingh","Jamalpur","Netrokona","Sherpur"]}};
const UPAZILA={Dhaka:["Savar","Dhamrai","Keraniganj","Dohar","Nawabganj"]}; // TODO: add more from official lists

/* ===== D. APP LOGIC ===== */
const $=id=>document.getElementById(id);
let lang="bn",activeTab="p-farm";
try{lang=localStorage.getItem("lang")||"bn"}catch(e){}
const tx=()=>T[lang];
const opt=(v,l)=>`<option value="${v}">${l}</option>`;

function applyText(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=tx()[e.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=tx()[e.dataset.ph]);
  $("langBtn").textContent=lang==="bn"?"English":"বাংলা";
  $("safeList").innerHTML=tx().safe.map(s=>`<li>${s}</li>`).join("");
  $("backend").innerHTML=tx().bk.map(b=>`<div class="card"><h3>${b[0]}</h3><p>${tx().needs} ${b[1]}</p><span class="badge">${lang==="bn"?"চালু নয়":"Not live"}</span></div>`).join("");
  document.title=tx().brand;
}
function buildEmergency(){
  $("emGrid").innerHTML=SERVICES.slice(0,3).map(s=>card(s,true)).join("");
}
function card(s,big){
  const t=tx(),d=s[lang];
  return `<article class="card"><div class="num">${s.tel}</div><h3>${d[0]}</h3><p>${d[1]}</p>
  <div class="row"><a class="btn btn-red" href="tel:${s.tel}">📞 ${t.call} ${s.tel}</a>
  <a class="small" href="${s.url}" target="_blank" rel="noopener">${t.src}</a></div></article>`;
}
function buildCats(){
  const c=tx().cat;
  $("cats").innerHTML=Object.keys(c).map(k=>`<button class="cat ${$("fCat").value===k?"on":""}" data-k="${k}"><span class="ic" aria-hidden="true">${CAT_ICONS[k]}</span>${c[k]}</button>`).join("");
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{$("fCat").value=b.dataset.k;renderResults();buildCats();$("services").scrollIntoView()});
}
function buildFilters(){
  const t=tx(),v={div:$("fDiv").value,dis:$("fDis").value,up:$("fUp").value,cat:$("fCat").value};
  $("fDiv").innerHTML=opt("",t.allDiv)+Object.keys(DIV).map(k=>opt(k,lang==="bn"?DIV[k].bn:k)).join("");
  $("fDiv").value=v.div||"";
  fillDistricts(v.dis);fillUpazilas(v.up);
  $("fCat").innerHTML=opt("",t.allCat)+Object.keys(t.cat).map(k=>opt(k,t.cat[k])).join("");
  $("fCat").value=v.cat||"";
}
function fillDistricts(sel){
  const d=$("fDiv").value;
  $("fDis").innerHTML=opt("",tx().allDis)+(d?DIV[d].d.map(x=>opt(x,x)).join(""):"");
  $("fDis").value=sel||"";
}
function fillUpazilas(sel){
  const d=$("fDiv").value,list=(d&&$("fDis").value==="Dhaka"&&UPAZILA.Dhaka)||[];
  $("fUp").innerHTML=opt("",tx().allUp)+list.map(x=>opt(x,x)).join("");
  $("fUp").value=sel||"";
}
function renderResults(){
  const q=$("q").value.trim().toLowerCase(),cat=$("fCat").value;
  const list=SERVICES.filter(s=>(!cat||s.cat===cat)&&(!q||(s.bn.join(" ")+s.en.join(" ")+s.tel+tx().cat[s.cat]).toLowerCase().includes(q)));
  $("results").innerHTML=list.length?list.map(s=>card(s)).join(""):`<div class="empty">${tx().noRes}</div>`;
  $("locNote").textContent=($("fDiv").value||$("fDis").value||$("fUp").value)?tx().locNone:tx().locAll;
}
function buildPanels(){
  const t=tx(),S=`<span class="badge">${t.sample}</span>`;
  const tabs=[["p-farm",t.tFarm],["p-adv",t.tAdv],["p-mkt",t.tMkt],["p-biz",t.tBiz],["p-sell",t.tSell]];
  $("tabs").innerHTML=tabs.map(x=>`<button class="tab ${x[0]===activeTab?"on":""}" role="tab" data-p="${x[0]}">${x[1]}</button>`).join("");
  $("p-farm").innerHTML=`<div class="card"><p>${t.farmP}</p></div>`;
  $("p-adv").innerHTML=`<div class="card"><h3>${t.advH} ${S}</h3><ul>${t.advL.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  $("p-mkt").innerHTML=`<div class="note">${t.mktNote}</div><div class="scroll"><table><tr>${t.mktH.map(h=>`<th>${h}</th>`).join("")}</tr>${t.mktR.map(r=>`<tr><td>${r}</td><td>${t.mktV}</td><td>${t.mktD}</td></tr>`).join("")}</table></div>`;
  $("p-biz").innerHTML=`<p>${t.bizP}</p><div class="grid">${t.bizCards.map(c=>`<div class="card"><h3>${c}</h3><p>${t.bizT}</p>${S}</div>`).join("")}</div>`;
  $("p-sell").innerHTML=`<div class="card"><p>${t.sellP}</p><span class="badge">${lang==="bn"?"চালু নয়":"Not live"}</span></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.p;showTab()});
  showTab();
}
function showTab(){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===activeTab));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.p===activeTab));
}
function renderAll(){applyText();buildFilters();buildEmergency();buildCats();renderResults();buildPanels()}

/* ===== E. EVENTS ===== */
$("langBtn").onclick=()=>{lang=lang==="bn"?"en":"bn";try{localStorage.setItem("lang",lang)}catch(e){}renderAll()};
$("heroSearch").onsubmit=e=>{e.preventDefault();renderResults();$("services").scrollIntoView()};
$("q").oninput=renderResults;
$("fDiv").onchange=()=>{fillDistricts();fillUpazilas();renderResults()};
$("fDis").onchange=()=>{fillUpazilas();renderResults()};
$("fUp").onchange=renderResults;
$("fCat").onchange=()=>{renderResults();buildCats()};
$("sendBtn").onclick=()=>{
  const body=encodeURIComponent($("msg").value);
  location.href="mailto:your-email@example.com?subject="+encodeURIComponent("Website feedback")+"&body="+body; // replace the email address
};
renderAll();
</script>
</body>
</html>
